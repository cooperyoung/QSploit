[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsploit"
version = "0.1.0"
description = "A local preview of future quantum-assisted TLS cryptanalysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "dpkt>=1.9.8,<2", "cryptography>=44,<48", "h11>=0.16,<1", "nh3>=0.2.21,<1"]

[project.optional-dependencies]
quantum = ["qiskit>=2,<3", "qiskit-aer>=0.17,<1"]
ionq = ["qiskit>=2,<3", "qiskit-ionq>=1,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[project.scripts]
qsploit = "qsploit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["qsploit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["quantum: executed quantum circuit tests", "browser: real Chromium acceptance"]
